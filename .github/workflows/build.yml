name: Build Pocket APK

on:
  push:
    branches: [main, field-tools]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: if these repository secrets exist, the APK is signed with your own
      # release key. If they do not, the keystore committed in app/ is used.
      - name: Use release keystore if provided
        env:
          KEYSTORE_B64: ${{ secrets.POCKET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "POCKET_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          POCKET_KEYSTORE_PASSWORD: ${{ secrets.POCKET_KEYSTORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CindrixPocket-${VERSION}-android.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: CindrixPocket-android
          path: dist/*.apk

      # a release page gives one plain download link that works from the phone itself
      - name: Publish the APK as a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="pocket-${VERSION}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --prerelease \
            --title "Cindrix Pocket ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Field view: cards, Academy with quizzes, scanner, new item from a scan, GPS tracking, outbox. Built by CI from ${GITHUB_SHA::7}. Not yet run on a real phone by the builder."
